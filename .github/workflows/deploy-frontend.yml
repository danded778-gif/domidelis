name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main  # O la rama que uses como principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 🚀 NUEVO PASO: Preparamos una carpeta temporal con ambas apps
      - name: Prepare deployment folder
        run: |
          mkdir -p deploy_output
          cp -r frontend/* deploy_output/
          cp -r app-tiendas deploy_output/app-tiendas

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ★ AHORA SUBIMOS LA CARPETA COMBINADA
          path: './deploy_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4