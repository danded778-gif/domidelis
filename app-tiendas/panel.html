<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E63946">
    <title>Mi Tienda - Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/tiendas.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="panel.html" class="logo"><i class="fas fa-store"></i> MI <span>TIENDA</span></a>
                <ul class="nav-links" id="nav-links">
                    <li><a href="#" onclick="cambiarTab('productos')"><i class="fas fa-box"></i> Productos</a></li>
                    <li><a href="#" onclick="cambiarTab('pedidos')"><i class="fas fa-receipt"></i> Pedidos</a></li>
                    <li><a href="#" onclick="cerrarSesionTienda()"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
                </ul>
                <div class="mobile-menu" onclick="document.getElementById('nav-links').classList.toggle('active')"><i class="fas fa-bars"></i></div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title" id="titulo-tienda"><i class="fas fa-store"></i> Cargando...</h2>
            
            <div class="tabs-container">
                <button class="tab-btn active" onclick="cambiarTab('productos')"><i class="fas fa-box"></i> Productos</button>
                <button class="tab-btn" onclick="cambiarTab('pedidos')"><i class="fas fa-receipt"></i> Pedidos</button>
            </div>

            <div id="tab-productos" class="tab-content active">
                <div class="aviso-premium"><i class="fas fa-crown"></i> <span>La edición de productos está disponible en el plan Premium.</span></div>
                <div class="products-admin-grid" id="lista-productos"></div>
            </div>

            <div id="tab-pedidos" class="tab-content">
                <div class="pedidos-grid" id="lista-pedidos"></div>
            </div>
        </div>
    </main>
    <script src="assets/js/config-tienda.js"></script>
    <script src="assets/js/tiendas.js"></script>
</body>
</html>
